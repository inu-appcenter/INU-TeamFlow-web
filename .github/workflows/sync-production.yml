name: Sync deployment branches

on:
  schedule:
    - cron: '17 * * * *'

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-deployment
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout deployment repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/inu-appcenter/INU-TeamFlow-web.git
          git fetch upstream main develop

      - name: Sync main to production
        run: |
          UPSTREAM_COMMIT=$(git rev-parse upstream/main)
          PRODUCTION_COMMIT=$(git ls-remote origin refs/heads/production | cut -f1)

          if [ "$UPSTREAM_COMMIT" = "$PRODUCTION_COMMIT" ]; then
            echo "Production is already up to date."
          else
            echo "Updating production."
            git push origin upstream/main:production --force
          fi

      - name: Sync develop
        run: |
          UPSTREAM_COMMIT=$(git rev-parse upstream/develop)
          DEVELOP_COMMIT=$(git ls-remote origin refs/heads/develop | cut -f1)

          if [ "$UPSTREAM_COMMIT" = "$DEVELOP_COMMIT" ]; then
            echo "Develop is already up to date."
          else
            echo "Updating develop."
            git push origin upstream/develop:develop --force
          fi